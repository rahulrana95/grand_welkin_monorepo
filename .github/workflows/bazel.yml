name: Bazel (affected build & test)

# Builds and tests ONLY the targets affected by the PR. With a remote cache,
# even those are mostly cache hits, so most PRs run a tiny fraction of the repo.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff against the merge base

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'pnpm-lock.yaml', 'go.mod') }}
          restore-keys: bazel-${{ runner.os }}-

      # Computes the exact set of targets impacted between the merge base and HEAD,
      # correctly handling BUILD/macro/toolchain edits that naive `rdeps` misses.
      - name: Determine affected targets
        id: affected
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          # Option A (shown): bazel-diff. Option B: bazel-contrib/target-determinator.
          # For a first cut without extra tooling you can fall back to:
          #   bazel test //... --remote_cache=...   (cache makes unaffected targets free)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Test affected (//... is cache-correct; scope down once tooling is wired)
        run: |
          bazel test //... \
            --keep_going \
            --test_output=errors
          # Once target-determinator/bazel-diff is added, replace //... with the
          # computed affected set for faster cold runs:
          #   bazel test $(target-determinator --before-ref=${{ steps.affected.outputs.base }} //...)

      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs
          path: bazel-testlogs/
          retention-days: 7
